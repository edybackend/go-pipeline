name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go vet, lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      # Backpressure, cancellation + rerun, fatal error without goroutine leaks, singleflight, retries.
      - run: go test -race -count=3 ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  run:
    name: Interrupt and rerun (real binary)
    runs-on: ubuntu-latest
    needs: [go]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build -o pipeline ./cmd/pipeline
      - name: Generate, interrupt with SIGINT, rerun, and check every valid line is stored once
        run: |
          set -euo pipefail
          ./pipeline generate -n 50000
          ./pipeline run -workers 2 -fx-latency 50ms > first.txt &
          sleep 3 && kill -INT $! && wait $! && code=0 || code=$?
          cat first.txt
          [ "$code" -eq 130 ] && grep -q INTERRUPTED first.txt
          ./pipeline run -workers 32 | tee second.txt
          stored=$(awk '/rows in database/ {print $4}' second.txt)
          rejected=$(awk '/^  rejected/ {print $2}' second.txt)
          echo "stored=$stored rejected=$rejected"
          [ $((stored + rejected)) -eq 50000 ]

  container:
    name: Docker Compose
    runs-on: ubuntu-latest
    needs: [go]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up --build --exit-code-from pipeline
      - if: always()
        run: docker compose down -v

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The CLI scans the full history; the action builds a "<first>^..HEAD" range that fails on a root commit.
      - name: Scan full git history with gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
